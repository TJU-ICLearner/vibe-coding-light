<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>自定义桌宠 · Vibe Coding Light</title>
  </head>
  <body>
    <main id="settings-app">
      <header><p class="eyebrow">VIBE CODING LIGHT</p><h1 data-i18n="settings_title">自定义桌宠</h1><p data-i18n="settings_intro">在本机用静态图片或透明 GIF 制作桌宠。</p></header>
      <div class="editor-layout">
        <aside id="preview-panel" class="preview-panel" aria-label="桌宠预览" data-i18n-aria-label="processed_alt">
          <div class="preview-heading"><span data-i18n="processed">桌宠预览（实际窗口尺寸）</span><span class="preview-size">128 × 128</span></div>
          <div class="preview-box checker"><div class="preview-viewport"><div class="preview-window"><div id="processed-frame"><img id="processed-preview" alt="透明桌宠预览" data-i18n-alt="processed_alt" /></div></div></div></div>
          <div class="original-row"><span data-i18n="original">原图</span><div class="original-thumb"><img id="original-preview" alt="原图预览" data-i18n-alt="original_alt" /></div></div>
        </aside>
        <div class="editor-main">
          <section class="panel import-panel">
            <h2 data-i18n="import_heading">1. 导入图片</h2>
            <label><span data-i18n="style_label">制作方式</span><select id="pet-style"><option value="single" data-i18n="style_single">单图：所有状态共用一张</option><option value="states" data-i18n="style_states">按状态：为不同状态设置素材</option></select></label>
            <p id="mode-hint" class="hint">单图模式只保存默认素材。切换模式会保留当前草稿。</p>
            <div id="asset-editor" class="asset-editor">
              <div id="slot-tabs" class="slot-tabs" role="tablist" aria-label="状态预览" data-i18n-aria-label="state_preview" hidden></div>
              <p id="waiting-help" class="hint" data-i18n="waiting_help" hidden>等待表示 Claude Code 或 Codex 正在请求确认或输入；其他工作可能从工作直接进入完成。</p>
              <div class="slot-editor-heading"><h3 id="slot-editor-title">默认素材</h3><span id="slot-completion" class="slot-completion"></span></div>
              <label><span id="slot-file-label" data-i18n="default_asset">默认素材（必选，PNG、JPEG 或透明 GIF，最大 10 MiB）</span><input id="photo-file" type="file" accept="image/png,image/jpeg,image/gif" /></label>
              <p id="slot-file-name" class="file-name"></p>
              <label><span data-i18n="processing_mode">处理方式</span><select id="photo-mode"><option value="remove_background" data-i18n="remove_background">自动去背景（macOS 14+）</option><option value="keep_alpha" data-i18n="keep_alpha">保留透明 PNG</option></select></label>
              <label><span data-i18n="motion_label">动态特效</span><select id="pet-motion"></select></label>
              <p id="motion-hint" class="hint" hidden></p>
              <p id="slot-status" class="slot-status" role="status"></p>
              <button id="slot-clear" class="subtle-button" type="button" hidden>移除该状态素材</button>
            </div>
          </section>
          <section class="panel">
            <h2 data-i18n="adjust_heading">2. 调整并保存</h2>
            <div class="controls">
              <label><span data-i18n="name">名称</span><input id="pet-name" maxlength="64" placeholder="给桌宠起个名字" data-i18n-placeholder="name_placeholder" /></label>
              <label><span data-i18n="scale">大小</span><input id="pet-scale" type="number" min="0.5" max="3" step="0.1" value="0.8" /></label>
            </div>
            <p id="status" role="status">请选择图片</p>
            <button id="save-pet" class="primary" type="button" disabled data-i18n="save_use">保存并使用</button>
          </section>
        </div>
      </div>
      <section class="panel"><h2 data-i18n="saved_heading">我的桌宠</h2><p id="saved-warning" class="warning" role="status" hidden></p><div id="saved-pets"></div></section>
    </main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
